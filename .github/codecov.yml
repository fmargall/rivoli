coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        # Same threshold as fail_under in [tool.coverage.report] of pyproject.toml
        target: 90%

codecov:
  notify:
    # Wait for the uploads of all the runs of the tests job of ci.yml. Computed
    # from the Python versions by the template, plus 1 for the lowest run added
    # to the project: check it after each `copier update`
    after_n_builds: 5

comment:
  # Same as codecov.notify.after_n_builds
  after_n_builds: 5
