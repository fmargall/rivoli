[INPUT]
inputAngleUnit = radians
inputParameterisation = spherical
inputFilePath = inputData.txt

[SOFTWARE]
floatingPointFormat = FP32
logLevel = DEBUG
parallelComputing = false

[PRESAMPLING]
preSamplingMethod = none
preSamplingNbPoints = 100

[INTERPOLATION]
interpolatorParameterisation = spherical
smoothingFunctionHemisphereOne = none
smoothingFunctionHemisphereTwo = none
regularisationParameter = 0.0
nonNegativityCorrectionParameter = 1.0

[INTERPOLATION.TOPOLOGY]
forceReciprocity = true
forceBilateralSymmetry = true

[INTERPOLATION.RBF]
kernel = linear
kernelParameters = 0.0, 0.0
[INTERPOLATION.RBF.LOCATION]
locationRBFFilePath = none
locationRBFParameterisation = spherical
locationRBFAngleUnit = radians

[POSTPROCESS]
thresholdCoefficient = 0.0000001

[OUTPUT]
outputFilePath = outputPattern.txt
outputFileParameterisation = spherical
outputFileAngleUnit = radians
