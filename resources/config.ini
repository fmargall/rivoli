[INPUT]
# Path to the input BRDF file. The format can be either
# BRDFSamples or .txt.
inputFilePath = resources/brdfManteauAinou.brdfSamples
# Sets if the input file is clusterised or not, if true
# means that an additional column is added at the left,
# which contains the cluster number.
isInputFileClusterised = true
# (Optional) Limit angle value in degrees for the first
# hemisphere to be considered for the input values. The
# default value is 90.
maximumThetaInputFirstHemisphere = 90.0
# (Optional) Limit angle value in degrees for the second
# hemisphere to be considered for the input values. The
# default value is 90.
maximumThetaInputSecondHemisphere = 90.0

[SOFTWARE]
# Can take the following values: 
#   TRACE > DEBUG > VERBOSE > INFO >
# > WARNING > ERROR > CRITICAL > OFF
logLevel = WARN
# Use the OpenMP library to parallelise the code. Can be
# either set to true or false, the latter one being only
# useful for debugging purposes.
parallelComputing = true
# Can take as input FP32 for simple precision 
#                or FP64 for double precision
floatingPointPrecision = FP32

[OUTPUT]
# Name and relative path to the output file. The relative
# path starts from the folder where the executable is run
outputFilePath = brdfManteauAinou.RBFCoeffs
# The output file format can be either RBFCoeffs or MERL.
outputFormat = MERL
# Force the writing of the outputfile to be single-thread
# This can be useful for debugging, without shutting down
# the parallel computing.
forceSingleThreadWriting = false

[INTERPOLATION]
# Parameters of the interpolation can be written here and
# then set for all clusters if there are multiple, or can 
# be passed using a dedicated interpolation.ini file.
# WARNING: CURRENTLY NOT SUPPORTED.

# interpolationParameterFilePath = interpolation.ini

# If the previous line is uncommented, the next ones wont
# be read. In the other case, the parameters chosen right
# after will be applied for every cluster.

# Parameterisation in which the interpolator should work.
# Is independent of the input parameterisation. Currently
# supports 'spherical' and 'rusinkiewicz'
interpolatorParameterisation = spherical
# Adds a BRDF value of 0 for a zenithal angle of pi / 2
# for the first hemisphere, using the given function to
# ponderate the BRDF values. Can be set to 'linear', or
# 'cosine'. Chose 'none' if one wants to disable it.
grazingAnglesFctHemisphereOne = none
# Same behavior as above, but for the second hemisphere.
grazingAnglesFctHemisphereTwo = none
# Parameter used for Tikhonov regularisation during the
# computation of the RBF coefficients. Should be set to
# 0 to be disabled.
regularisationParameter = 0.0005
# Parameter used to ensure non-negativity of the BRDF
# Should be set to 0 to be disabled, 1 to be enabled.
nonNegativityCorrectionParameter = 2.0
# Parameter used to force the BRDF to be reciprocal.
forceReciprocity = false
# Parameter used to force the BRDF to be symmetrical
forceBilateralSymmetry = true

[INTERPOLATION.RBF]
# Relative or absolute path to the location of the RBFs
# file. Should contain N columns, N being the dimension
# of the BRDF, the angles given in the parameterisation
# of the interpolator in radians.
locationRBFFilePath = resources/RBFLocation.txt
# Locations of RBF can also be defined using a sampler,
# associated with the number of RBF that should be used
# Only Fibonacci sampler is currently supported.
locationRBFSampler  = fibonacci
numberRBF           = 90
# Selects the kernel used for the RBF interpolation.
# Can be set to 'linear' or 'cubic' currently.
kernel = linear