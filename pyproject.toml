[build-system]
# setuptools 77 reads the SPDX license expression (PEP 639) of the license field
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "rivoli"
dynamic = ["version"]
description = "Physically-based interpolation code by radial basis function dedicated to BRDF, spherical or bispherical modeling functions and data reconstruction."
authors = [
    { name = "François Margall", email = "fr.margall@proton.me" },
]
keywords = [
    "interpolation",
    "brdf",
    "rbf",
    "ebf",
    "erbf",
    "pbr",
    "modeling",
]
# Add the "Intended Audience" and "Topic" classifiers of the project:
# https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    # Same versions as the tests matrix of ci.yml
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.txt"]
requires-python = ">=3.13"
# The lower bounds are the oldest versions that RIVOLI works with, tested by the
# lowest run of the tests job of ci.yml: a library must not force its users to
# upgrade the packages it shares with others. NumPy follows SPEC 0, which supports
# the versions released in the last two years
dependencies = [
    "numpy>=2.2",
]

[project.urls]
Homepage = "https://github.com/fmargall/rivoli"
Repository = "https://github.com/fmargall/rivoli"
Issues = "https://github.com/fmargall/rivoli/issues"
Changelog = "https://github.com/fmargall/rivoli/blob/main/CHANGELOG.md"

# Optional features for users go in extras, published with the package and
# installed with `pip install rivoli[name]`
[project.optional-dependencies]
# GPU and parallel CPU kernels of rivoli.warp
warp = ["warp-lang>=1.7"]
# Reading of measurements in HDF5 files by rivoli.hdf5
hdf5 = ["h5py>=3.12"]

# Tools for contributors go in dependency groups (PEP 735): they are not published,
# and are installed with `uv sync` (or `pip install -e . --group dev`, pip >= 25.1)
[dependency-groups]
# warp-lang runs the kernels of rivoli.warp on the CPU when there is no GPU, as in CI
# Plotting of the scripts of examples/
examples = ["matplotlib"]
# The examples are run by the tests, so that they follow the API
test = ["pytest", "pytest-cov", "warp-lang>=1.7", "h5py>=3.12", { include-group = "examples" }]
# pyright is pinned: each release can add new errors, upgrades must be deliberate.
# The "nodejs" extra ships Node.js as a wheel instead of downloading it at first run.
dev = [
    { include-group = "test" },
    "ruff",
    "pre-commit",
    "pyright[nodejs]==1.1.414",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rivoli*"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
# An older pytest fails clearly instead of ignoring the options it does not know
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
# Warnings are errors: a deprecation in a dependency fails the tests while there
# is still time to adapt, instead of scrolling by unread. An expected warning is
# allowed by adding an "ignore:..." filter after "error".
filterwarnings = [
    "error",
    # Warp 1.18 declares packed ctypes structures without a _layout_, deprecated
    # since Python 3.14 outside Windows. Remove once a release of Warp fixes it
    "ignore:Due to '_pack_', the '.*' Structure will use memory layout compatible with MSVC:DeprecationWarning",
]
# Shown with the output of a failing test only
log_level = "INFO"

[tool.coverage.run]
branch = true
source = ["rivoli"]

[tool.coverage.report]
show_missing = true
fail_under = 90
# Warp functions and kernels run compiled, out of reach of the Python tracer:
# excluding their decorator excludes their whole body. Their tests compare them
# with their NumPy counterparts instead
exclude_also = ['@wp\.(func|kernel)']

[tool.pyright]
# Tests are checked too: they are the first client of the public API. So are the
# scripts of the repository, such as the release script, and the examples
include = ["src", "tests", "scripts", "examples"]
# Check against the oldest supported version, so newer syntax is rejected
pythonVersion = "3.13"
typeCheckingMode = "standard"
# Not part of strict mode: flag "# type: ignore" comments that no longer hide anything
reportUnnecessaryTypeIgnoreComment = "error"
